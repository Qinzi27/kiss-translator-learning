name: Build learning edition

# Build on demand. Tags do not deploy Pages or publish releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test translation and security regressions
        env:
          CI: true
        run: pnpm test --watchAll=false --runInBand
      - name: Test offline service security (no models required)
        run: python3 -m unittest discover -s offline -p 'test_*.py'
      - name: Audit locked dependencies
        run: pnpm audit --audit-level high
      - run: pnpm build:chrome
      - run: python3 src/scripts/package-learning.py
      - uses: actions/upload-artifact@v4
        with:
          name: kiss-translator-learning
          path: releases/
          if-no-files-found: error
          retention-days: 14
